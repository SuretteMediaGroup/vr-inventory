<title>Vintage Roots Inventory</title>
<style>
:root{--ink:#161616;--mut:#6b6b6b;--line:#e8e5e0;--soft:#f6f5f2;--acc:#7a5c2e;--red:#b3261e;--amb:#a35f00;--grn:#2c7a3f;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
#wrap{max-width:980px;margin:0 auto;padding:0 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:20}
header img{height:28px;display:block;flex:none}
#sync{font-size:11px}
@media(max-width:520px){#sync{display:none}}
.hr{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:var(--mut);border-radius:8px}
nav button.on{color:var(--ink);font-weight:700}
nav button.on:after{content:"";display:block;height:2px;background:var(--ink);margin:4px 12px 0}
@media(min-width:900px){nav{position:sticky;top:55px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:flex-start;gap:6px;padding:0}nav button{flex:0 0 auto;padding:12px 16px;font-size:14px}nav button.on:after{margin:4px 0 -1px}#wrap{padding-bottom:40px}}
h1{font-size:20px;margin:18px 0 4px}h2{font-size:15px;margin:20px 0 8px}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:12px}
.banner{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;margin:12px 0;background:var(--soft)}
.banner.red{border-left-color:var(--red);background:#fdf3f2}
.btn{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.p{background:var(--ink);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}.btn.g{border-color:var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin:8px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;white-space:nowrap;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cc{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:#fff}
.cc.done{border-color:var(--ink);background:var(--soft)}
.cc.hit{border-color:var(--grn);background:#f1faf3}
.cc .code{font-weight:800;font-size:17px;word-break:break-word}
.cc .exp{font-size:11px;color:var(--mut);min-height:15px}
.ctr{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:4px}
.ctr button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;line-height:1}
.ctr input{width:44px;height:32px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:0}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lrow .nm{flex:1;min-width:0}.lrow .nm b{display:block}.lrow .nm small{color:var(--mut)}
.gh{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:16px 0 6px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.pill.out{color:var(--red);border-color:var(--red)}.pill.low{color:var(--amb);border-color:var(--amb)}.pill.ok{color:var(--grn);border-color:var(--grn)}.pill.sale{background:var(--acc);border-color:var(--acc);color:#fff}
input.f,select.f,textarea.f{border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;background:#fff}
textarea.f{min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.inl{width:70px!important;text-align:center;padding:6px!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:14px}}
.modal h3{margin:0 0 8px}
video{width:100%;border-radius:10px;background:#000;max-height:50vh}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:#fff;padding:9px 14px;border-radius:99px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
#lock{position:fixed;inset:0;background:#fff;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{width:100%;max-width:320px;text-align:center}
#lock img{height:44px;margin-bottom:18px}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}.pin i.on{background:var(--ink)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp button{height:54px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:22px}
.err{color:var(--red);min-height:20px;font-size:13px}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important;padding:24px;font-size:13px}#print table{width:100%;border-collapse:collapse}#print td,#print th{border-bottom:1px solid #ccc;padding:6px;text-align:left}}
.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.tbl th{font-size:12px;color:var(--mut)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo .t{flex:1}.todo small{color:var(--mut);display:block}
.chk{width:20px;height:20px;border:2px solid var(--ink);border-radius:5px;flex:none;margin-top:2px}.chk.on{background:var(--ink)}
</style>
</head>

<div id="wrap"><header><img id="logo" alt="Vintage Roots Hair Salon"><div class="hr"><span id="sync"></span><button class="btn g sm" data-act="settings">Settings</button></div></header><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div><div id="print"></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>

/* ---------- product helpers ---------- */
function plist(l){return Object.keys(S.products).map(function(k){return S.products[k];}).filter(function(p){return !l||p.line===l;}).sort(function(a,b){return a.o-b.o;});}
function oh(id){var v=S.onHand[id];return v==null?null:v;}
function incoming(id){var n=0;S.orders.forEach(function(o){if(o.status==='sent'){o.lines.forEach(function(l){if(l.id===id)n+=l.qty;});}});return n;}
function status(p){
  if(S.onDemand[p.id])return 'od';
  var v=oh(p.id);if(v==null)return 'unc';
  var par=S.par[p.id]||0;if(par<=0)return 'nopar';
  if(v<=0)return 'out';if(v<par)return 'low';return 'ok';
}
function suggest(p){
  if(S.onDemand[p.id])return 0;var par=S.par[p.id]||0;if(par<=0)return 0;var v=oh(p.id);if(v==null)return 0;
  return Math.max(0,par-v-incoming(p.id));
}
function grpOf(p){
  if(p.line==='BB'||p.line==='CR')return p.grp||'Other';
  if(p.code.indexOf('@')>-1)return '@ shades';
  var m=p.code.match(/^(\d+)/);return m?('Level '+m[1]):'Other';
}
function grpOrder(g){var m=g.match(/^Level (\d+)/);if(m)return parseInt(m[1],10);if(g==='@ shades')return 98;return 99;}
function groups(list){
  var map={},order=[];
  list.forEach(function(p){var g=grpOf(p);if(!map[g]){map[g]=[];order.push(g);}map[g].push(p);});
  if(list.length&&(list[0].line==='TC'||list[0].line==='CO'||list[0].line==='GT'))order.sort(function(a,b){return grpOrder(a)-grpOrder(b);});
  return order.map(function(g){return [g,map[g]];});
}
function matchQ(p,qq){if(!qq)return true;qq=qq.toLowerCase();return (p.code+' '+p.name+' '+p.short).toLowerCase().indexOf(qq)>-1;}

/* ---------- PIN ---------- */
function hash(s){
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode('vr:'+s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
  }
  var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);h|=0;}return Promise.resolve('f'+h);
}
var pinBuf='',pinStage=0,pinFirst='';
function showLock(){
  var L=$('#lock');L.style.display='flex';
  var setup=!S.pin;
  L.innerHTML='<div class="box"><img src="'+LOGO+'" alt=""><div style="font-weight:700">'+(setup?(pinStage===0?'Create a 4-digit PIN':'Confirm your PIN'):'Enter PIN')+'</div><div class="pin">'+[0,1,2,3].map(function(i){return '<i class="'+(i<pinBuf.length?'on':'')+'"></i>';}).join('')+'</div><div class="err" id="perr"></div><div class="kp">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-pin="'+n+'">'+n+'</button>';}).join('')+'<button data-pin="x" style="font-size:15px">Clear</button><button data-pin="0">0</button><button data-pin="b">⌫</button></div></div>';
}
function pinKey(k){
  if(k==='x')pinBuf='';else if(k==='b')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
  showLock();
  if(pinBuf.length<4)return;
  var typed=pinBuf;pinBuf='';
  if(!S.pin){
    if(pinStage===0){pinFirst=typed;pinStage=1;showLock();return;}
    if(typed!==pinFirst){pinStage=0;pinFirst='';showLock();$('#perr').textContent='PINs did not match. Try again.';return;}
    hash(typed).then(function(h){S.pin=h;save();unlock();});return;
  }
  hash(typed).then(function(h){if(h===S.pin)unlock();else{showLock();$('#perr').textContent='Wrong PIN';}});
}

  if(ids.length){
    h+='<h2>Text for Karen</h2><textarea class="f" id="otext" data-inp="otext">'+esc(S.otext!=null&&S.otextAuto===orderText()?S.otext:orderText())+'</textarea>';
    h+='<div class="row" style="margin-top:10px"><button class="btn p" data-act="copytext">Copy text</button><button class="btn" data-act="sms">Open in Messages</button><button class="btn g" data-act="printpo">PDF / print</button><span class="sp"></span><button class="btn" data-act="marksent">Mark as sent</button></div>';
  }
  if(sug.length){h+='<h2>Suggested</h2><p class="sub">Gap to par, minus anything already on order.</p><div class="card" style="padding:4px 12px">'+sug.map(function(p){return '<div class="lrow"><div class="nm"><b>'+esc(tag(p)?lineName(p.line)+' '+p.code:p.name)+(S.onSale[p.id]?' <span class="pill sale">SALE</span>':'')+'</b><small>on hand '+oh(p.id)+' · par '+S.par[p.id]+'</small></div><button class="btn sm" data-act="addone" data-id="'+p.id+'">Add '+suggest(p)+'</button></div>';}).join('')+'</div>';}
  var sent=S.orders.slice(-5).reverse();
  if(sent.length){h+='<h2>Order history</h2><div class="card" style="padding:4px 12px">'+sent.map(function(o){return '<div class="lrow"><div class="nm"><b>'+esc(o.id)+'</b><small>'+o.status+' · '+o.lines.reduce(function(a,l){return a+l.qty;},0)+' items · '+fmtDate(o.sentAt)+'</small></div></div>';}).join('')+'</div>';}
  return h;
}
function vProducts(){
  var list=plist(lineSel).filter(function(p){return matchQ(p,q);});
  var h='<h1>Products</h1><p class="sub">Par is the least you want on hand. On Demand silences alerts for shades you only stock when a client needs them.</p>'+lineTabs('prod');
  h+='<div class="row"><input class="f sp" id="q" placeholder="Search" value="'+esc(q)+'" data-inp="pq" style="min-width:140px"><button class="btn g" data-act="addprod">Add product</button><button class="btn g" data-act="csv">Export CSV</button></div>';
  h+='<div id="plist">'+prodTable(list)+'</div>';
  return h;
}
function prodTable(list){
  if(!list.length)return '<p class="sub">No products match.</p>';
  var h='<table class="tbl" style="margin-top:10px"><tr><th>Product</th><th>On hand</th><th>Par</th><th>Bin</th><th>On Demand</th><th>Sale</th><th></th></tr>';
  list.forEach(function(p){
    var s=status(p);var pill=s==='out'?'<span class="pill out">out</span>':s==='low'?'<span class="pill low">low</span>':s==='unc'?'<span class="pill">uncounted</span>':'';
    var nb=Object.keys(S.barcodes).filter(function(b){return S.barcodes[b]===p.id;}).length;
    h+='<tr><td><b>'+esc(tag(p)?p.code:p.name)+'</b> '+pill+(nb?'':' <small style="color:var(--mut)">no barcode</small>')+'</td><td>'+(oh(p.id)==null?'?':oh(p.id))+'</td><td><input class="f inl" type="number" inputmode="numeric" min="0" data-inp="par" data-id="'+p.id+'" value="'+(S.par[p.id]||'')+'"></td><td><input class="f inl" style="width:90px!important" data-inp="loc" data-id="'+p.id+'" value="'+esc(S.loc[p.id]||'')+'" placeholder="bin"></td><td><input type="checkbox" data-inp="od" data-id="'+p.id+'"'+(S.onDemand[p.id]?' checked':'')+'></td><td><input type="checkbox" data-inp="sale" data-id="'+p.id+'"'+(S.onSale[p.id]?' checked':'')+'></td><td><button class="btn g sm" data-act="linkbar" data-id="'+p.id+'">Link barcode</button></td></tr>';
  });
  return h+'</table>';
}

/* ---------- modals ---------- */
function modal(html){$('#modal').innerHTML='<div class="modal" data-act="mclose"><div class="box" data-stop="1">'+html+'</div></div>';}
function closeModal(){$('#modal').innerHTML='';}
function pickProduct(title,cb,only){
  pickCb=cb;modal('<h3>'+esc(title)+'</h3><input class="f" id="pq" placeholder="Search shade or product" data-inp="pick" autofocus><div id="pres" style="margin-top:8px"></div><div class="row" style="margin-top:10px"><button class="btn g" data-act="mclose2">Cancel</button></div>');
  pickOnly=only||null;pickRes('');
}
var pickCb=null,pickOnly=null;
function pickRes(qq){
  var list=plist(pickOnly).filter(function(p){return matchQ(p,qq);}).slice(0,40);
  $('#pres').innerHTML=list.map(function(p){return '<div class="lrow" data-act="pick" data-id="'+p.id+'" style="cursor:pointer"><div class="nm"><b>'+esc(tag(p)?lineName(p.line)+' '+p.code:p.name)+'</b></div></div>';}).join('')||'<p class="sub">No match</p>';
}

/* ---------- scanner ---------- */
var zx=null,scanMode=null,scanBusy=false,lastScan={c:'',t:0},scanTally=0;
function openScan(mode){
  scanMode=mode;scanTally=0;
  $('#modal').innerHTML='<div class="modal" style="align-items:center"><div class="box" style="border-radius:14px"><h3>Scan</h3><video id="vid" playsinline muted></video><div id="scanmsg" class="sub" style="margin-top:8px">Point the camera at a barcode.</div><div class="row" style="margin-top:8px"><input class="f sp" id="manbar" placeholder="Or type the barcode number" inputmode="numeric"><button class="btn" data-act="manbar">Add</button></div><div class="row" style="margin-top:10px"><button class="btn p" data-act="scandone">Done</button></div></div></div>';
  if(!window.ZXing||!navigator.mediaDevices){$('#scanmsg').textContent='Camera scanning is not available here. You can type the barcode number instead.';return;}
  try{
    zx=new ZXing.BrowserMultiFormatReader();
    zx.decodeFromConstraints({video:{facingMode:'environment'}},'vid',function(res){if(res)onCode(res.getText());});
  }catch(e){$('#scanmsg').textContent='Could not start the camera. Allow camera access in your browser settings.';}
}
function closeScan(){try{if(zx){zx.reset();zx=null;}}catch(e){}}
function onCode(code){
  if(scanBusy)return;var now=Date.now();if(code===lastScan.c&&now-lastScan.t<1800)return;lastScan={c:code,t:now};
  var id=S.barcodes[code];
  if(id){applyScan(id);return;}
  scanBusy=true;
  var prev=$('#modal').innerHTML;
  var layer=document.createElement('div');layer.id='scanpick';document.body.appendChild(layer);
  layer.innerHTML='<div class="modal" style="z-index:80"><div class="box"><h3>New barcode</h3><p class="sub">'+esc(code)+' is not linked to a product yet. Pick the product so it is remembered.</p><input class="f" id="pq" placeholder="Search shade or product" data-inp="pickscan" data-code="'+esc(code)+'"><div id="pres" style="margin-top:8px"></div><div class="row" style="margin-top:10px"><button class="btn g" data-act="skipscan">Skip</button></div></div></div>';
  pickOnly=null;pickRes('');
  window._scanCode=code;
}
function applyScan(id){
  var p=S.products[id];scanTally++;
  if(scanMode==='count'){S.countDraft[id]=(S.countDraft[id]||0)+1;save(true);toast((tag(p)?p.code:p.short)+' → '+S.countDraft[id]);}
  else if(scanMode==='emp'){S.emp[id]=(S.emp[id]||0)+1;save(true);toast((tag(p)?p.code:p.short)+' empty ×'+S.emp[id]);}
  else if(scanMode==='recv'){if(S.recv){S.recv.got[id]=(S.recv.got[id]||0)+1;save(true);toast((tag(p)?p.code:p.short)+' received ×'+S.recv.got[id]);}}
  else if(scanMode==='order'){S.cart[id]=(S.cart[id]||0)+1;save(true);toast((tag(p)?p.code:p.short)+' added ×'+S.cart[id]);}
  else if(scanMode==='link'){linkBarcode(window._linkCode,id);}
  var m=$('#scanmsg');if(m)m.textContent=scanTally+' scanned · last: '+(tag(p)?lineName(p.line)+' '+p.code:p.name);
}
function linkBarcode(code,id){S.barcodes[code]=id;logEv('barcode',id,0,code);save();toast('Linked');}

/* ---------- actions ---------- */
function applyCountFlow(){
  var d=S.countDraft,ids=Object.keys(d);if(!ids.length)return;
  var diffs=ids.filter(function(id){return oh(id)!==d[id];});
  var h='<h3>Apply count</h3><p class="sub">'+ids.length+' products counted. '+diffs.length+' differ from the numbers on file.</p>';
  if(diffs.length){h+='<div class="card" style="padding:4px 12px;max-height:40vh;overflow:auto">'+diffs.map(function(id){var p=S.products[id];var b=oh(id);return '<div class="lrow"><div class="nm"><b>'+esc(tag(p)?lineName(p.line)+' '+p.code:p.name)+'</b></div><span>'+(b==null?'?':b)+' → <b>'+d[id]+'</b></span></div>';}).join('')+'</div>';}
  h+='<div class="row" style="margin-top:12px"><button class="btn p" data-act="doapply">Apply</button><button class="btn g" data-act="mclose2">Cancel</button></div>';
  modal(h);
}
function doApply(){
  var d=S.countDraft;Object.keys(d).forEach(function(id){var b=oh(id);if(b!==d[id])logEv('count',id,d[id]-(b||0),'counted '+d[id]+' (was '+(b==null?'?':b)+')');S.onHand[id]=d[id];S.verified[id]=Date.now();});
  S.countDraft={};save();closeModal();render();toast('Count applied');
}
function commitEmp(){
  var d=S.emp,ids=Object.keys(d).filter(function(k){return d[k]>0;});if(!ids.length)return;
  var wk=weekKey();S.empHist[wk]=S.empHist[wk]||{};
  ids.forEach(function(id){var b=oh(id);if(b!=null)S.onHand[id]=Math.max(0,b-d[id]);S.empHist[wk][id]=(S.empHist[wk][id]||0)+d[id];logEv('empty',id,-d[id],'week of '+wk);});
  S.emp={};S.lastEmp=Date.now();S.todo.trash=true;save();render();toast('Week committed');
}
function startRecv(oid){S.recv={orderId:oid||null,got:{},dmg:{},extra:[],ref:''};if(oid){var o=S.orders.filter(function(x){return x.id===oid;})[0];o.lines.forEach(function(l){S.recv.got[l.id]=0;});}save(true);render();}
function confirmRecv(){
  var r=S.recv,ids=Object.keys(r.got).filter(function(k){return r.got[k]>0||r.dmg[k]>0;});
  if(!ids.length){toast('Nothing received yet');return;}
  var dmgLines=[];
  ids.forEach(function(id){var g=r.got[id]||0,dm=r.dmg[id]||0,good=Math.max(0,g-dm);var b=oh(id);S.onHand[id]=(b==null?0:b)+good;logEv('receive',id,good,dm?('damaged '+dm+(r.ref?', ref '+r.ref:'')):'');if(dm){var p=S.products[id];dmgLines.push((tag(p)?lineName(p.line)+' '+p.code:p.name)+' × '+dm);}});
  if(r.orderId){var o=S.orders.filter(function(x){return x.id===r.orderId;})[0];o.status='received';o.receivedAt=Date.now();o.ref=r.ref;o.recvGot=r.got;o.recvDmg=r.dmg;}
  var msg=dmgLines.length?('Hi Karen, we received our order'+(r.ref?' (ref '+r.ref+')':'')+' and these arrived damaged:\n'+dmgLines.join('\n')+'\nCan we get credit or a replacement?'):'';
  S.recv=null;save();render();
  if(msg){modal('<h3>Damaged items</h3><p class="sub">Copy this to text Karen.</p><textarea class="f" id="dmgtext" style="min-height:140px">'+esc(msg)+'</textarea><div class="row" style="margin-top:10px"><button class="btn p" data-act="copydmg">Copy</button><button class="btn g" data-act="mclose2">Close</button></div>');}
  else toast('Received and added to On Hand');
}
function copy(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Copied');},function(){fallbackCopy(t);});}else fallbackCopy(t);
}
function fallbackCopy(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied');}catch(e){toast('Copy failed');}a.remove();}
function curText(){var t=$('#otext');return t?t.value:orderText();}
function markSent(){
  var ids=orderLines();if(!ids.length)return;
  var n=S.orders.length+1;var id='VR-'+ymd().replace(/-/g,'')+'-'+(n<10?'0'+n:n);
  S.orders.push({id:id,status:'sent',sentAt:Date.now(),text:curText(),lines:ids.map(function(i){return {id:i,qty:S.cart[i]};})});
  logEv('order',null,0,id+' sent to Karen');
  S.cart={};S.otext=null;save();render();toast('Marked as sent');
}
function printPO(){
  var ids=orderLines();var h='<img src="'+LOGO+'" style="height:44px"><h2 style="margin:12px 0 2px">Order for Karen</h2><div style="color:#555">Vintage Roots Hair Salon · 153 Main St, North Reading, MA 01864 · '+new Date().toLocaleDateString()+'</div><br>';
  LINES.forEach(function(l){var li=ids.filter(function(i){return S.products[i].line===l[0];});if(!li.length)return;h+='<h3 style="margin:14px 0 4px">'+l[1]+'</h3><table><tr><th>Item</th><th style="width:70px">Qty</th></tr>'+li.map(function(i){var p=S.products[i];return '<tr><td>'+esc(tag(p)?p.code:p.name)+(S.onSale[i]?' (sale)':'')+'</td><td>'+S.cart[i]+'</td></tr>';}).join('')+'</table>';});
  $('#print').innerHTML=h;setTimeout(function(){window.print();},50);
}
function exportCSV(){
  var rows=[['Line','Code','Name','On hand','Par','On demand','Bin','Verified']];
  plist().forEach(function(p){rows.push([lineName(p.line),p.code,p.name,oh(p.id)==null?'':oh(p.id),S.par[p.id]||'',S.onDemand[p.id]?'yes':'',S.loc[p.id]||'',S.verified[p.id]?'yes':'']);});
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='vr-inventory-'+ymd()+'.csv';document.body.appendChild(a);a.click();a.remove();
}
function settings(){
  var c=cfg();
  modal('<h3>Settings</h3><div class="gh">Karen\'s number (for Messages)</div><input class="f" id="karen" inputmode="tel" value="'+esc(S.karen||'')+'" placeholder="978…"><div class="gh">Shared data (Supabase)</div><input class="f" id="sbu" placeholder="Project URL" value="'+esc(c.supabaseUrl)+'"><input class="f" id="sbk" placeholder="Anon key" style="margin-top:6px" value="'+esc(c.supabaseKey)+'"><div class="gh">Backup</div><div class="row"><button class="btn g sm" data-act="backup">Download backup</button><button class="btn g sm" data-act="restore">Restore backup</button></div><input type="file" id="rfile" accept=".json" style="display:none"><div class="gh">Security</div><button class="btn g sm" data-act="changepin">Change PIN</button> <button class="btn g sm" data-act="lockn">Lock now</button><div class="row" style="margin-top:16px"><button class="btn p" data-act="savesettings">Save</button><button class="btn g" data-act="mclose2">Close</button></div>');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var pk=e.target.closest('[data-pin]');if(pk){pinKey(pk.getAttribute('data-pin'));return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act'),ds=b.dataset;
  if(a==='mclose'){if(e.target===b)closeModal();return;}
  if(a==='mclose2'){closeModal();return;}
  if(a==='view'){setView(ds.v);}
  else if(a==='cnt'){lineSel=ds.l;setView('count');}
  else if(a==='line'){lineSel=ds.l;q='';render();}
  else if(a==='inc')bump(ds.k,ds.id,1);
  else if(a==='dec')bump(ds.k,ds.id,-1);
  else if(a==='match'){var v=oh(ds.id);bump('count',ds.id,0,v==null?0:v);}
  else if(a==='scan'){openScan(ds.mode);}
  else if(a==='scandone'){closeScan();closeModal();render();}
  else if(a==='manbar'){var v2=($('#manbar').value||'').trim();if(v2){lastScan={c:'',t:0};onCode(v2);$('#manbar').value='';}}
  else if(a==='applycount')applyCountFlow();
  else if(a==='doapply')doApply();
  else if(a==='commitemp'){if(confirm('Commit this week\'s empties and remove them from On Hand?'))commitEmp();}
  else if(a==='startrecv')startRecv(ds.o);
  else if(a==='cancelrecv'){if(confirm('Discard this receiving session?')){S.recv=null;save(true);render();}}
  else if(a==='addrecv'){pickProduct('Add an item',function(id){S.recv.extra=S.recv.extra||[];if(S.recv.extra.indexOf(id)<0)S.recv.extra.push(id);S.recv.got[id]=S.recv.got[id]||0;save(true);closeModal();render();});}
  else if(a==='confirmrecv')confirmRecv();
  else if(a==='copydmg'){copy($('#dmgtext').value);}
  else if(a==='addsug'){plist().forEach(function(p){var s=suggest(p);if(s>0&&!S.cart[p.id])S.cart[p.id]=s;});save(true);render();}
  else if(a==='addone'){S.cart[ds.id]=suggest(S.products[ds.id]);save(true);render();}
  else if(a==='addany'){pickProduct('Add to order',function(id){S.cart[id]=(S.cart[id]||0)+1;save(true);closeModal();render();});}
  else if(a==='copytext')copy(curText());
  else if(a==='sms'){var t=curText();var ios=/iPhone|iPad|Mac/.test(navigator.userAgent);location.href='sms:'+(S.karen||'')+(ios?'&':'?')+'body='+encodeURIComponent(t);}
  else if(a==='printpo')printPO();
  else if(a==='marksent'){if(confirm('Mark this order as sent to Karen?'))markSent();}
  else if(a==='pick'){var id=ds.id;if(window._scanPick){linkBarcode(window._scanCode,id);var lay=$('#scanpick');if(lay)lay.remove();scanBusy=false;window._scanPick=false;applyScan(id);}else if(pickCb){var f=pickCb;pickCb=null;f(id);}}
  else if(a==='skipscan'){var l2=$('#scanpick');if(l2)l2.remove();scanBusy=false;}
  else if(a==='todo'){S.todo[ds.key]=!S.todo[ds.key];save(true);render();}
  else if(a==='csv')exportCSV();
  else if(a==='addprod'){modal('<h3>Add product</h3><select class="f" id="np_l">'+LINES.map(function(l){return '<option value="'+l[0]+'">'+l[1]+'</option>';}).join('')+'</select><input class="f" id="np_c" placeholder="Shade code or product name" style="margin-top:8px"><div class="row" style="margin-top:12px"><button class="btn p" data-act="saveprod">Add</button><button class="btn g" data-act="mclose2">Cancel</button></div>');}
  else if(a==='saveprod'){var ln=$('#np_l').value,cd=($('#np_c').value||'').trim();if(!cd)return;var pid=ln+'_USR_'+cd.replace(/[^A-Za-z0-9@]+/g,'_');if(S.products[pid]){toast('Already exists');return;}var mx=0;plist().forEach(function(p){if(p.o>mx)mx=p.o;});S.products[pid]={id:pid,line:ln,code:cd,name:(ln==='TC'||ln==='CO'||ln==='GT')?lineName(ln)+' '+cd:cd,short:cd,size:'',grp:ln==='BB'||ln==='CR'?'Other':null,o:mx+1};logEv('add',pid,0,'product added');save();closeModal();lineSel=ln;render();}
  else if(a==='linkbar'){window._linkCode=null;var pid2=ds.id;scanMode='link';openScan('link');window._scanLinkId=pid2;}
  else if(a==='settings')settings();
  else if(a==='savesettings'){S.karen=($('#karen').value||'').trim();try{localStorage.setItem(CFGK,JSON.stringify({supabaseUrl:($('#sbu').value||'').trim(),supabaseKey:($('#sbk').value||'').trim()}));}catch(x){}save();closeModal();toast('Saved');}
  else if(a==='backup'){var aa=document.createElement('a');aa.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));aa.download='vr-inventory-backup-'+ymd()+'.json';document.body.appendChild(aa);aa.click();aa.remove();}
  else if(a==='restore'){var rf=$('#rfile');rf.onchange=function(){var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(d&&d.products){if(confirm('Replace all current data with this backup?')){S=d;save();closeModal();render();toast('Restored');}}}catch(x){toast('Not a valid backup');}};fr.readAsText(rf.files[0]);};rf.click();}
  else if(a==='changepin'){S.pin=null;pinStage=0;pinBuf='';unlocked=false;closeModal();showLock();}
  else if(a==='lockn'){try{localStorage.removeItem(UNL);}catch(x){}unlocked=false;closeModal();pinBuf='';showLock();}
});
document.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-inp');if(!k)return;
  if(k==='q'){q=t.value;var g=$('#grid');if(g)g.innerHTML=gridFor(view==='empties'?'emp':'count');}
  else if(k==='pq'){q=t.value;var pl=$('#plist');if(pl)pl.innerHTML=prodTable(plist(lineSel).filter(function(p){return matchQ(p,q);}));}
  else if(k==='pick'){pickRes(t.value);}
  else if(k==='pickscan'){window._scanPick=true;pickRes(t.value);}
  else if(k==='otext'){S.otext=t.value;S.otextAuto=orderText();}
  else if(k==='ref'){S.recv.ref=t.value;save(true);}
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-inp');if(!k)return;var id=t.getAttribute('data-id');
  if(k==='ctr'){var kind=t.getAttribute('data-k');var v=t.value===''?null:Math.max(0,parseInt(t.value,10)||0);
    if(kind==='cart'){if(v==null||v===0)delete S.cart[id];else S.cart[id]=v;save(true);render();}
    else{if(v==null)delete draftOf(kind)[id];else draftOf(kind)[id]=v;save(true);refreshCard(kind,id);}}
  else if(k==='par'){var pv=parseInt(t.value,10);if(pv>0)S.par[id]=pv;else delete S.par[id];save();}
  else if(k==='loc'){if(t.value.trim())S.loc[id]=t.value.trim();else delete S.loc[id];save();}
  else if(k==='od'){if(t.checked)S.onDemand[id]=1;else delete S.onDemand[id];save();}
  else if(k==='sale'){if(t.checked)S.onSale[id]=1;else delete S.onSale[id];save();}
});
/* scan-pick needs a flag when the barcode picker layer is open */
var _origOnCode=onCode;
onCode=function(code){
  if(scanMode==='link'&&window._scanLinkId){window._linkCode=code;var id=window._scanLinkId;window._scanLinkId=null;linkBarcode(code,id);closeScan();closeModal();render();return;}
  _origOnCode(code);
};

/* ---------- boot ---------- */
load();
$('#logo').src=LOGO;
cloudPull(function(){
  if(isUnlocked()){unlocked=true;render();}else{showLock();}
});
if('serviceWorker' in navigator){/* offline support can be added later */}
})();
</script>
</body>
</html>
